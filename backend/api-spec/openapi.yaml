openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Koda AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: students
    description: Authenticated student resources
  - name: companies
    description: Company internship operations
  - name: internships
    description: Internship operations
  - name: applications
    description: Application operations
  - name: verification
    description: Student verification
  - name: dashboard
    description: Dashboard statistics
  - name: talent
    description: Assessment and internship matching

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/social:
    post:
      operationId: socialLogin
      tags: [auth]
      summary: Authenticate using a verified social-provider session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid provider session or role
        "401":
          description: Invalid provider session
        "503":
          description: Identity provider temporarily unavailable

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Students
  /students/{id}/recommended:
    get:
      operationId: getRecommendedInternships
      tags: [students]
      summary: Get recommendations for an authenticated student
      description: The path ID is the authenticated users.id; the server derives students.id from the session.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommended internships with match score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternshipWithMatch"

  /talent/recommendations:
    get:
      operationId: getTalentRecommendations
      tags: [talent]
      summary: Get authenticated student's transparent internship matches
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Ranked open internships and evidence-based match breakdowns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternshipWithMatch"

  /talent/recommendations/refresh:
    post:
      operationId: refreshTalentRecommendations
      tags: [talent]
      summary: Recalculate and persist the authenticated student's match snapshot
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Calculated recommendations with saved match snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternshipWithMatch"

  /talent/profile:
    get:
      operationId: getTalentProfile
      tags: [talent]
      summary: Get the authenticated student's matching evidence
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated student's profile and matching evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentTalentProfile"
        "401":
          description: Authentication required
    put:
      operationId: updateTalentSkills
      tags: [talent]
      summary: Update the authenticated student's profile fields and skills
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentTalentProfileInput"
      responses:
        "200":
          description: Updated profile fields and skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentTalentProfileInput"
        "400":
          description: Invalid profile fields
        "401":
          description: Authentication required

  /talent/profile/evidence:
    put:
      operationId: replaceTalentEvidence
      tags: [talent]
      summary: Replace the authenticated student's structured evidence
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentEvidenceInput"
      responses:
        "200":
          description: Evidence saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean

  /talent/skills:
    get:
      operationId: getTalentTaxonomy
      tags: [talent]
      summary: List the supported IT roles and skills
      responses:
        "200":
          description: Role and skill taxonomy
          content:
            application/json:
              schema:
                type: object

  /talent/company/internships/{internshipId}/requirements:
    get:
      operationId: getInternshipTalentRequirements
      tags: [talent]
      summary: Get matching rules for a company-owned internship
      security:
        - BearerAuth: []
      parameters:
        - name: internshipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matching weights and eligibility requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipTalentRequirementsInput"
    put:
      operationId: updateInternshipTalentRequirements
      tags: [talent]
      summary: Configure role, skill weights, score weights, and eligibility for a company-owned internship
      security:
        - BearerAuth: []
      parameters:
        - name: internshipId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternshipTalentRequirementsInput"
      responses:
        "200":
          description: Requirements updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipTalentRequirementsInput"

  /talent/privacy/university-consents:
    post:
      operationId: grantUniversityAnalyticsConsent
      tags: [talent]
      summary: Grant a university access to minimum-cohort aggregate analytics
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [universityId]
              properties:
                universityId:
                  type: integer
      responses:
        "200":
          description: Consent granted
          content:
            application/json:
              schema:
                type: object

  /talent/privacy/university-consents/{universityId}:
    delete:
      operationId: revokeUniversityAnalyticsConsent
      tags: [talent]
      summary: Revoke university aggregate analytics consent
      security:
        - BearerAuth: []
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consent revoked
          content:
            application/json:
              schema:
                type: object

  /talent/privacy/company-consents:
    post:
      operationId: grantCompanyAssessmentConsent
      tags: [talent]
      summary: Share assessment results with the company for an application
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId:
                  type: integer
      responses:
        "200":
          description: Consent granted
          content:
            application/json:
              schema:
                type: object

  /talent/privacy/company-consents/{applicationId}:
    delete:
      operationId: revokeCompanyAssessmentConsent
      tags: [talent]
      summary: Revoke company assessment sharing consent
      security:
        - BearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consent revoked
          content:
            application/json:
              schema:
                type: object

  /talent/university/analytics:
    get:
      operationId: getUniversityTalentAnalytics
      tags: [talent]
      summary: Get consented, verified-student aggregate analytics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aggregate analytics, suppressed below the minimum cohort size
          content:
            application/json:
              schema:
                type: object

  /talent/assessments:
    get:
      operationId: listAvailableAssessments
      tags: [talent]
      summary: List reviewed and published assessments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Assessments currently available to students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentSummary"

  /talent/admin/assessments:
    post:
      operationId: createAssessment
      tags: [talent]
      summary: Create a draft assessment from authored question-bank content
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Draft assessment created; question review and publication are required
          content:
            application/json:
              schema:
                type: object

  /talent/admin/assessment-versions/{versionId}:
    get:
      operationId: getAssessmentForReview
      tags: [talent]
      summary: Get assessment content and answer keys for an administrator to review
      security:
        - BearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Private review content including answer keys
          content:
            application/json:
              schema:
                type: object

  /talent/admin/assessment-attempts/{attemptId}/questions/{questionId}/grade:
    post:
      operationId: gradeSubjectiveAssessmentAnswer
      tags: [talent]
      summary: Grade a submitted subjective answer against its rubric
      security:
        - BearerAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRubricGrade"
      responses:
        "200":
          description: Human review recorded; results are finalized when all subjective answers are graded
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Rubric scores are invalid
        "409":
          description: Attempt is not awaiting review

  /talent/admin/assessment-attempts/pending-review:
    get:
      operationId: listAssessmentsPendingReview
      tags: [talent]
      summary: List subjective assessment answers awaiting rubric-based human review
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending answers with their prompt and review rubric
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    attemptId:
                      type: integer
                    studentId:
                      type: integer
                    assessmentTitle:
                      type: string
                    submittedAt:
                      type: ["string", "null"]
                    questions:
                      type: array
                      items:
                        type: object

  /talent/admin/assessment-questions/{questionId}:
    put:
      operationId: editAssessmentQuestion
      tags: [talent]
      summary: Edit an unreviewed assessment question
      security:
        - BearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentQuestionInput"
      responses:
        "200":
          description: Question updated
          content:
            application/json:
              schema:
                type: object

  /talent/admin/assessment-questions/{questionId}/review:
    post:
      operationId: reviewAssessmentQuestion
      tags: [talent]
      summary: Mark a question as human-reviewed
      security:
        - BearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question reviewed
          content:
            application/json:
              schema:
                type: object

  /talent/admin/assessment-versions/{versionId}/publish:
    post:
      operationId: publishReviewedAssessment
      tags: [talent]
      summary: Publish an assessment only after every question is reviewed
      security:
        - BearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviewed assessment published
          content:
            application/json:
              schema:
                type: object

  /talent/assessment-history:
    get:
      operationId: getAssessmentHistory
      tags: [talent]
      summary: Get the authenticated student's assessment history and skill scores
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Assessment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentHistoryItem"

  /talent/assessments/{versionId}/attempts:
    post:
      operationId: startAssessmentAttempt
      tags: [talent]
      summary: Start a timed assessment
      security:
        - BearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Started assessment attempt; answer keys are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"

  /talent/attempts/{attemptId}:
    get:
      operationId: getAssessmentAttempt
      tags: [talent]
      summary: Get the authenticated student's assessment attempt
      security:
        - BearerAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attempt and public question data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"

  /talent/attempts/{attemptId}/answers/{questionId}:
    put:
      operationId: saveAssessmentAnswer
      tags: [talent]
      summary: Save one validated assessment answer
      security:
        - BearerAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {}
      responses:
        "200":
          description: Answer saved
          content:
            application/json:
              schema:
                type: object

  /talent/attempts/{attemptId}/submit:
    post:
      operationId: submitAssessmentAttempt
      tags: [talent]
      summary: Submit and deterministically score an assessment
      security:
        - BearerAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted attempt and score results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"

  /companies/{id}/internships:
    get:
      operationId: getCompanyInternships
      tags: [companies]
      summary: Get internships for the authenticated company user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Authenticated users.id for the company; companies.id is resolved by the server.
      responses:
        "200":
          description: Internships list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Internship"

  # Internships
  /internships:
    get:
      operationId: listInternships
      tags: [internships]
      summary: List internships with optional filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: skill
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Internships list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Internship"
    post:
      operationId: createInternship
      tags: [internships]
      summary: Create internship posting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternshipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internship"

  /internships/{id}:
    get:
      operationId: getInternship
      tags: [internships]
      summary: Get internship details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Internship details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipDetail"
    put:
      operationId: updateInternship
      tags: [internships]
      summary: Update internship
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternshipInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internship"
    delete:
      operationId: deleteInternship
      tags: [internships]
      summary: Delete internship
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /internships/{id}/applicants:
    get:
      operationId: getInternshipApplicants
      tags: [internships]
      summary: Get applicants for an internship
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationWithStudent"

  /internships/{id}/match:
    get:
      operationId: getMatchScore
      tags: [internships]
      summary: Get deterministic match score for the authenticated student
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: query
          required: true
          schema:
            type: integer
          description: Authenticated users.id for the student; the server verifies it against the bearer session.
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"

  # Applications
  /applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Apply for an internship
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /students/{id}/applications:
    get:
      operationId: getStudentApplications
      tags: [applications]
      summary: Get applications for the authenticated student user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Authenticated users.id; the server resolves students.id from the session.
      responses:
        "200":
          description: Student applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"

  /applications/{id}/status:
    put:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status (accept/reject)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # Verification
  /verification:
    get:
      operationId: listVerificationRequests
      tags: [verification]
      summary: Get verification requests (for university)
      security:
        - BearerAuth: []
      parameters:
        - name: universityId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationRequest"
  /verification/{id}/status:
    put:
      operationId: updateVerificationStatus
      tags: [verification]
      summary: Approve or reject verification (university)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"

  # Dashboards
  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Get student dashboard stats
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"

  /dashboard/company:
    get:
      operationId: getCompanyDashboard
      tags: [dashboard]
      summary: Get company dashboard stats
      security:
        - BearerAuth: []
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"

  /dashboard/university:
    get:
      operationId: getUniversityDashboard
      tags: [dashboard]
      summary: Get university dashboard stats
      security:
        - BearerAuth: []
      parameters:
        - name: universityId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: University stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      required: [ok, service]
      properties:
        ok:
          type: boolean
        service:
          type: string

    # Auth
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, company, university]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    SocialLoginInput:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          maxLength: 8192
        role:
          type: string
          enum: [student, company, university]

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, company, university, admin]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    # Internship
    Internship:
      type: object
      required: [id, companyId, title, description, status, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        companyName:
          type: string
        companyLogo:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        location:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        salary:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, closed, draft]
        deadline:
          type: ["string", "null"]
        applicantsCount:
          type: integer
        createdAt:
          type: string

    InternshipDetail:
      type: object
      required: [id, companyId, title, description, status, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        companyName:
          type: string
        companyLogo:
          type: ["string", "null"]
        companyWebsite:
          type: ["string", "null"]
        companyIndustry:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        location:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        salary:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, closed, draft]
        deadline:
          type: ["string", "null"]
        applicantsCount:
          type: integer
        createdAt:
          type: string

    InternshipInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        type:
          type: string
        duration:
          type: string
        skills:
          type: array
          items:
            type: string
        salary:
          type: string
        status:
          type: string
          enum: [open, closed, draft]
        deadline:
          type: string

    InternshipWithMatch:
      type: object
      required: [id, companyId, title, description, status, createdAt, matchScore]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        companyName:
          type: string
        companyLogo:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        location:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        salary:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, closed, draft]
        deadline:
          type: ["string", "null"]
        applicantsCount:
          type: integer
        createdAt:
          type: string
        matchScore:
          type: ["number", "null"]
        matchExplanation:
          type: string
        eligible:
          type: boolean
        eligibilityReasons:
          type: array
          items:
            type: string
        evidenceCoverage:
          type: number
        weights:
          type: object
          properties:
            assessment:
              type: number
            skills:
              type: number
            projectsExperience:
              type: number
            education:
              type: number
        breakdown:
          type: object

    MatchResult:
      type: object
      required: [matchScore, matchExplanation, matchedSkills, missingSkills, eligible, eligibilityReasons]
      properties:
        matchScore:
          type: ["number", "null"]
        matchExplanation:
          type: string
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        eligible:
          type: boolean
        eligibilityReasons:
          type: array
          items:
            type: string

    # Application
    Application:
      type: object
      required: [id, studentId, internshipId, status, createdAt]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        internshipId:
          type: integer
        internshipTitle:
          type: string
        companyName:
          type: string
        companyLogo:
          type: ["string", "null"]
        coverLetter:
          type: ["string", "null"]
        matchScore:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected, withdrawn]
        createdAt:
          type: string

    ApplicationWithStudent:
      type: object
      required: [id, studentId, internshipId, status, createdAt]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        internshipId:
          type: integer
        internshipTitle:
          type: string
        studentName:
          type: string
        studentEmail:
          type: string
        studentAvatar:
          type: ["string", "null"]
        studentSkills:
          type: array
          items:
            type: string
        studentUniversity:
          type: ["string", "null"]
        coverLetter:
          type: ["string", "null"]
        matchScore:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected, withdrawn]
        createdAt:
          type: string
        assessmentScores:
          type: array
          items:
            type: object
            required: [skill, score]
            properties:
              skill:
                type: string
              score:
                type: number

    ApplicationInput:
      type: object
      required: [studentId, internshipId]
      properties:
        studentId:
          type: integer
          description: Authenticated users.id (validated against the session; students.id is derived server-side).
        internshipId:
          type: integer
        coverLetter:
          type: string

    ApplicationStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]

    # Verification
    VerificationRequest:
      type: object
      required: [id, studentId, universityId, status, createdAt]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        universityId:
          type: integer
        studentName:
          type: string
        studentEmail:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string

    VerificationStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]

    StudentEvidenceInput:
      type: object
      required: [projects, experience, education]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
              skills:
                type: array
                items:
                  type: string
              url:
                type: string
                maxLength: 2048
                pattern: "^https?://"
              startedAt:
                type: ["string", "null"]
                format: date-time
              completedAt:
                type: ["string", "null"]
                format: date-time
        experience:
          type: array
          items:
            type: object
            required: [organization, title]
            properties:
              organization:
                type: string
              title:
                type: string
              description:
                type: string
              skills:
                type: array
                items:
                  type: string
              startedAt:
                type: ["string", "null"]
                format: date-time
              endedAt:
                type: ["string", "null"]
                format: date-time
        education:
          type: array
          items:
            type: object
            required: [institution]
            properties:
              institution:
                type: string
              degree:
                type: string
              fieldOfStudy:
                type: string
              coursework:
                type: array
                items:
                  type: string
              startDate:
                type: ["string", "null"]
                format: date-time
              endDate:
                type: ["string", "null"]
                format: date-time

    StudentTalentProfile:
      type: object
      required: [university, gpa, bio, resumeUrl, verified, skills, projects, experience, education]
      properties:
        university:
          type: ["string", "null"]
        gpa:
          type: ["number", "null"]
        bio:
          type: ["string", "null"]
        resumeUrl:
          type: ["string", "null"]
        verified:
          type: boolean
        skills:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/StudentProject"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/StudentExperience"
        education:
          type: array
          items:
            $ref: "#/components/schemas/StudentEducation"

    StudentTalentProfileInput:
      type: object
      required: [skills]
      properties:
        university:
          type: ["string", "null"]
        gpa:
          type: ["number", "null"]
          minimum: 0
          maximum: 5
        bio:
          type: ["string", "null"]
          maxLength: 500
        resumeUrl:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
          pattern: "^https?://"
        skills:
          type: array
          maxItems: 100
          items:
            type: string

    StudentProject:
      type: object
      required: [id, name, description, skills, url, startedAt, completedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        url:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    StudentExperience:
      type: object
      required: [id, organization, title, description, skills, startedAt, endedAt]
      properties:
        id:
          type: integer
        organization:
          type: string
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time

    StudentEducation:
      type: object
      required: [id, institution, degree, fieldOfStudy, coursework, startDate, endDate]
      properties:
        id:
          type: integer
        institution:
          type: string
        degree:
          type: ["string", "null"]
        fieldOfStudy:
          type: ["string", "null"]
        coursework:
          type: array
          items:
            type: string
        startDate:
          type: ["string", "null"]
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time

    InternshipTalentRequirementsInput:
      type: object
      properties:
        roleId:
          type: ["integer", "null"]
        requiredCoursework:
          type: array
          items:
            type: string
        requiredFieldsOfStudy:
          type: array
          items:
            type: string
        matchWeights:
          $ref: "#/components/schemas/MatchWeights"
        skillWeights:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        minimumMatchScore:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        minimumAssessmentScore:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        requireVerifiedStudent:
          type: boolean

    MatchWeights:
      type: object
      required: [assessment, skills, projectsExperience, education]
      properties:
        assessment:
          type: number
          minimum: 0
          maximum: 1
        skills:
          type: number
          minimum: 0
          maximum: 1
        projectsExperience:
          type: number
          minimum: 0
          maximum: 1
        education:
          type: number
          minimum: 0
          maximum: 1

    AssessmentSummary:
      type: object
      required: [id, templateId, version, title, skill, difficulty, durationMinutes, questionCount]
      properties:
        id:
          type: integer
        templateId:
          type: integer
        version:
          type: integer
        title:
          type: string
        skill:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        durationMinutes:
          type: integer
        questionCount:
          type: integer

    AssessmentInput:
      type: object
      required: [skillId, difficulty, questions]
      properties:
        skillId:
          type: integer
        roleId:
          type: ["integer", "null"]
        title:
          type: string
          maxLength: 200
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 240
        questions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/AssessmentQuestionInput"

    AssessmentQuestionInput:
      type: object
      required: [type, prompt]
      properties:
        type:
          type: string
          enum: [single_choice, multi_select, scenario, code_reading, short_answer]
        prompt:
          type: string
          maxLength: 2000
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
        answerKey:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
              additionalProperties: false
        rubric:
          type: array
          maxItems: 20
          items:
            type: object
            required: [criterion, maxPoints]
            properties:
              criterion:
                type: string
                maxLength: 500
              maxPoints:
                type: number
                exclusiveMinimum: 0
        maxPoints:
          type: number
          minimum: 0.01
          maximum: 1000
        explanation:
          type: string
          maxLength: 2000

    AssessmentRubricGrade:
      type: object
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [criterion, points]
            properties:
              criterion:
                type: string
              points:
                type: number
                minimum: 0
        notes:
          type: string
          maxLength: 2000

    AssessmentHistoryItem:
      type: object
      required: [id, title, status, startedAt, skillScores]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [in_progress, pending_review, submitted, expired]
        startedAt:
          type: string
        submittedAt:
          type: ["string", "null"]
        overallScore:
          type: ["number", "null"]
        skillScores:
          type: array
          items:
            type: object
            properties:
              skill:
                type: string
              score:
                type: number

    AssessmentAttempt:
      type: object
      required: [id, status, startedAt, expiresAt, questions]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [in_progress, pending_review, submitted, expired]
        startedAt:
          type: string
        expiresAt:
          type: string
        submittedAt:
          type: ["string", "null"]
        overallScore:
          type: ["number", "null"]
        resultExplanation:
          type: ["string", "null"]
        questions:
          type: array
          items:
            type: object
            required: [id, position, skillId, type, difficulty, prompt, options, answer]
            properties:
              id:
                type: integer
              position:
                type: integer
              skillId:
                type: integer
              type:
                type: string
              difficulty:
                type: string
              prompt:
                type: string
              options:
                type: array
                nullable: true
                items:
                  type: object
              answer:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  - type: "null"
              earnedPoints:
                type: ["number", "null"]
              explanation:
                type: ["string", "null"]
              rubric:
                type: array
                items:
                  type: object
                  properties:
                    criterion:
                      type: string
                    maxPoints:
                      type: number

    # Dashboards
    StudentDashboard:
      type: object
      required: [totalApplications, pendingApplications, acceptedApplications, rejectedApplications, profileCompleteness, recommendedCount]
      properties:
        totalApplications:
          type: integer
        pendingApplications:
          type: integer
        acceptedApplications:
          type: integer
        rejectedApplications:
          type: integer
        profileCompleteness:
          type: integer
        recommendedCount:
          type: integer
        recentApplications:
          type: array
          items:
            $ref: "#/components/schemas/Application"

    CompanyDashboard:
      type: object
      required: [totalInternships, activeInternships, totalApplicants, pendingApplicants]
      properties:
        totalInternships:
          type: integer
        activeInternships:
          type: integer
        totalApplicants:
          type: integer
        pendingApplicants:
          type: integer
        acceptedApplicants:
          type: integer
        recentApplications:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationWithStudent"

    UniversityDashboard:
      type: object
      required: [totalStudents, verifiedStudents, pendingVerifications, placedStudents]
      properties:
        totalStudents:
          type: integer
        verifiedStudents:
          type: integer
        pendingVerifications:
          type: integer
        placedStudents:
          type: integer
        recentVerifications:
          type: array
          items:
            $ref: "#/components/schemas/VerificationRequest"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
