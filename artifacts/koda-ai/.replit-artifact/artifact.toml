kind = "web"
previewPath = "/"
title = "Koda AI"
version = "1.0.0"
id = "artifacts/koda-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25632

[services.development]
run = "pnpm --filter @workspace/koda-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/koda-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/koda-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25632"
BASE_PATH = "/"
